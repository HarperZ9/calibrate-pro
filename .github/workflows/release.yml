name: Release

# NOTE: publishing is gated. Calibrate Pro's runtime color dependency (build-color /
# quanta-color) must be resolvable on PyPI before a public release, otherwise end-user
# `pip install calibrate-pro` cannot resolve it. Cut the color library release first.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the wheel installs and registers its metadata
        run: |
          python -m venv /tmp/v
          # Runtime color dependency is git-hosted until its own PyPI release lands.
          /tmp/v/bin/pip install "numpy>=1.24" "scipy>=1.10" git+https://github.com/HarperZ9/quanta-color.git
          /tmp/v/bin/pip install --no-deps dist/*.whl
          /tmp/v/bin/python -c "import importlib.metadata as m; print('calibrate-pro', m.version('calibrate-pro'))"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC); no API token stored
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
