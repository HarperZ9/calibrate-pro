[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrate-pro"
dynamic = ["version"]
description = "Windows display calibration toolkit with evidence-labeled sensorless and measured workflows, DDC/CI, ICC/LUT output, and reports"
readme = "README.md"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zain Dana Harper" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "build-color>=1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/HarperZ9/calibrate-pro"
Repository = "https://github.com/HarperZ9/calibrate-pro"
Issues = "https://github.com/HarperZ9/calibrate-pro/issues"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.11.1,<7", "build-ui>=2,<3"]
tray = ["pystray>=0.19.4", "Pillow>=10.0,<11"]
sensor = ["hidapi>=0.14,<1"]
macos = ["pyobjc-framework-Quartz>=9.0,<11", "pyobjc-framework-CoreFoundation>=9.0,<11"]
test = ["pytest>=8.0", "pytest-cov>=5", "tomli>=2; python_version<'3.11'"]
dev = ["pytest>=8.0", "pytest-cov>=5", "tomli>=2; python_version<'3.11'", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]
all = [
    "PySide6-Essentials>=6.11.1,<7",
    "build-ui>=2,<3",
    "pystray>=0.19.4",
    "Pillow>=10.0,<11",
    "hidapi>=0.14,<1",
]

[project.scripts]
calibrate-pro = "calibrate_pro.main:main"

[tool.setuptools.dynamic]
version = {attr = "calibrate_pro.__version__"}

[tool.setuptools.packages.find]
include = ["calibrate_pro*"]

[tool.setuptools.package-data]
calibrate_pro = ["resources/*.ico", "resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: requires the Windows runtime contracts exercised by the canonical Windows candidate",
]

[tool.coverage.run]
source = ["calibrate_pro"]
omit = ["*/gui/*", "*/tray/*"]  # GUI/tray are exercised manually, not in headless CI

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.10"
platform = "win32"
files = ["calibrate_pro"]
# External native/GUI libraries (hidapi, PySide6, pystray, pyobjc, win32) ship no type
# stubs; ignore their missing imports rather than vendor stubs.
ignore_missing_imports = true

# The native-hardware, GUI, platform, and tray layers are thin adapters over untyped
# C/Qt/OS libraries. They are checked at their public boundary but are not strict-typed
# internally. The pure-Python color, calibration, LUT, and verification core IS type-clean.
# lut_system wraps the untyped Windows DWM 3D LUT API and AMD/NVIDIA vendor driver SDKs
# (same OS/GPU driver adapter rationale as hardware/platform). app.py is the top-level
# application shell that wires GUI/CLI/services together and is boundary-typed, not
# strict-typed, like the other adapter/shell layers above.
[[tool.mypy.overrides]]
module = [
    "calibrate_pro.gui.*",
    "calibrate_pro.hardware.*",
    "calibrate_pro.platform.*",
    "calibrate_pro.tray.*",
    "calibrate_pro.lut_system.*",
    "calibrate_pro.app",
]
ignore_errors = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "I",     # isort
]
ignore = ["E501", "E701", "E702", "E741", "B905", "SIM102", "SIM105", "SIM108", "SIM112", "SIM117", "E402", "SIM113", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional in __init__ files

[tool.ruff.format]
quote-style = "double"
